<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">

  <title>H-LINK | 해운대경찰서 스마트 업무지원</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #eef3f8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 1080px;
      min-height: 100vh;
      background: #ffffff;
      overflow-x: hidden;
    }

    .page {
      display: none;
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .page.active {
      display: block;
    }

    .page-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }

    /*
      투명 터치영역
    */
    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      cursor: pointer;
      background: rgba(255,255,255,0);
      border: 0;
      padding: 0;
      margin: 0;
      text-decoration: none;
      touch-action: manipulation;
    }

    .hotspot:active {
      background: rgba(30, 100, 210, 0.08);
    }
