<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#ffffff">

<title>H-LINK | 해운대경찰서 스마트 업무지원</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#edf2f7;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

body{
    display:flex;
    justify-content:center;
}

/* =========================
   전체 앱
========================= */

#app{
    position:relative;
    width:100%;
    max-width:1080px;
    min-height:100vh;
    background:white;
    overflow-x:hidden;
}

/* =========================
   페이지
========================= */

.page{
    display:none;
    position:relative;
    width:100%;
    margin:0;
    padding:0;
}

.page.active{
    display:block;
}

/* 이미지 길이가 달라도 자동 대응 */

.page-image{
    display:block;
    width:100%;
    height:auto;
    margin:0;
    padding:0;
    border:0;
}

/* =========================
   투명 터치 영역
========================= */

.hotspot{
    position:absolute;
    z-index:20;

    display:block;

    margin:0;
    padding:0;

    border:0;

    background:rgba(255,255,255,0);

    cursor:pointer;
    touch-action:manipulation;

    text-decoration:none;
}

.hotspot:active{
    background:rgba(30,100,210,.08);
}

/* =========================
   이전 버튼
========================= */

.back-button{
    position:fixed;

    left:14px;
    top:14px;

    z-index:100;

    border:0;
    border-radius:50px;

    padding:10px 16px;

    background:rgba(255,255,255,.94);

    color:#174a87;

    font-size:15px;
    font-weight:700;

    box-shadow:
    0 3px 12px rgba(0,0,0,.18);

    cursor:pointer;
}

#home .back-button,
#district-main .back-button{
    display:none;
}

/* 작은 화면 */

@media(max-width:480px){

    .back-button{
        top:10px;
        left:10px;

        padding:8px 13px;

        font-size:13px;
    }
}

</style>
</head>


<body>

<div id="app">


<!-- =====================================================
     유관기관 메인
===================================================== -->

<section id="district-main"
         class="page active">

    <img
        src="district_main.png"
        class="page-image"
        alt="유관기관 연락처">


    <!-- ① 해운대구청 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:25%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-office')">
    </button>


    <!-- ② 동 행정복지센터 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:33%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-dong')">
    </button>


    <!-- ③ 보건·의료기관 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:41%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-health')">
    </button>


    <!-- ④ 소방서 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:49%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-fire')">
    </button>


    <!-- ⑤ 보호·응급지원기관 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:57%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-support')">
    </button>


    <!-- ⑥ 교통·도로기관 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:65%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-traffic')">
    </button>


    <!-- ⑦ 공공·업무 유관기관 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:73%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-public')">
    </button>


    <!-- ⑧ 다중이용시설 -->

    <button
        class="hotspot"
        style="
        left:7%;
        top:81%;
        width:86%;
        height:7%;
        "
        onclick="openPage('district-facilities')">
    </button>

</section>



<!-- =====================================================
     ① 해운대구청
===================================================== -->

<section id="district-office"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_office.png"
class="page-image"
alt="해운대구청">

</section>



<!-- =====================================================
     ② 동 행정복지센터
===================================================== -->

<section id="district-dong"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_dong.png"
class="page-image"
alt="동 행정복지센터">

</section>



<!-- =====================================================
     ③ 보건·의료기관
===================================================== -->

<section id="district-health"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_health.png"
class="page-image"
alt="보건 의료기관">

</section>



<!-- =====================================================
     ④ 소방서
===================================================== -->

<section id="district-fire"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_fire.png"
class="page-image"
alt="소방서">

</section>



<!-- =====================================================
     ⑤ 보호·응급지원기관
===================================================== -->

<section id="district-support"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_support.png"
class="page-image"
alt="보호 응급지원기관">

</section>



<!-- =====================================================
     ⑥ 교통·도로기관
===================================================== -->

<section id="district-traffic"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_traffic.png"
class="page-image"
alt="교통 도로기관">

</section>



<!-- =====================================================
     ⑦ 공공·업무 유관기관
===================================================== -->

<section id="district-public"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_public.png"
class="page-image"
alt="공공 업무 유관기관">

</section>



<!-- =====================================================
     ⑧ 다중이용시설
===================================================== -->

<section id="district-facilities"
         class="page">

<button class="back-button"
        onclick="goBack()">
← 이전으로
</button>

<img
src="district_facilities.png"
class="page-image"
alt="다중이용시설">

</section>


</div>



<script>

/* ==========================================
   페이지 이동 기록
========================================== */

let pageHistory = [];


/* ==========================================
   페이지 열기
========================================== */

function openPage(pageId){

    const current =
        document.querySelector(".page.active");

    if(current){

        pageHistory.push(current.id);

        current.classList.remove("active");
    }

    const next =
        document.getElementById(pageId);

    if(!next) return;

    next.classList.add("active");

    window.scrollTo({
        top:0,
        left:0,
        behavior:"instant"
    });
}


/* ==========================================
   이전 페이지
========================================== */

function goBack(){

    const current =
        document.querySelector(".page.active");

    if(current){
        current.classList.remove("active");
    }

    const previous =
        pageHistory.pop() || "district-main";

    const page =
        document.getElementById(previous);

    if(page){
        page.classList.add("active");
    }

    window.scrollTo({
        top:0,
        left:0,
        behavior:"instant"
    });
}


/* ==========================================
   휴대폰 뒤로가기 대응
========================================== */

window.addEventListener(
    "popstate",
    function(){

        if(pageHistory.length){
            goBack();
        }
    }
);


/* ==========================================
   이미지 드래그 방지
========================================== */

document.querySelectorAll("img")
.forEach(function(img){

    img.setAttribute(
        "draggable",
        "false"
    );

});


</script>

</body>
</html>
