<script>

/* =====================================================
   지역관서 이미지 선로딩
===================================================== */

let localImagesLoaded = false;

function preloadLocalImages(){

    if(localImagesLoaded){
        return;
    }

    localImagesLoaded = true;

    const localImages = [

        "./local_jaesong.png",
        "./local_banyeo.png",
        "./local_jwadong.png",
        "./local_jungdong.png",
        "./local_udong.png",
        "./local_bansong.png",
        "./local_banyeo23.png",
        "./local_banseok.png",
        "./local_songjeong.png"

    ];

    localImages.forEach(function(src){

        const img = new Image();

        img.src = src;

    });

}


/* =====================================================
   페이지 이동
===================================================== */

function showPage(pageId){

    const target =
        document.getElementById(pageId);

    if(!target){

        console.error(
            "페이지를 찾을 수 없습니다:",
            pageId
        );

        return;

    }

    document
        .querySelectorAll(".page")
        .forEach(function(page){

            page.classList.remove("active");

        });


    target.classList.add("active");


    window.scrollTo(0,0);


    /* 지역관서 화면이 뜨는 순간
       9개 세부 이미지 백그라운드 로딩 */

    if(pageId === "local"){

        preloadLocalImages();

    }

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    showPage("home");

}


/* =====================================================
   이미지 드래그 방지
===================================================== */

document
    .querySelectorAll("img")
    .forEach(function(img){

        img.setAttribute(
            "draggable",
            "false"
        );

    });


/* =====================================================
   PWA
===================================================== */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator
                .serviceWorker
                .register("./sw.js")
                .catch(function(error){

                    console.log(
                        "Service Worker error:",
                        error
                    );

                });

        }
    );

}

</script>
