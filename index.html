const HLINK_SUPABASE_URL="https://wikqcnzwnnpejmybnwav.supabase.co";
const HLINK_PUBLISHABLE_KEY="sb_publishable_hZC-TNEeJxCna2ZAhPTK1w_xSNe5-5w";
const hlinkPassword=document.getElementById("hlinkPassword");
const loginButton=document.getElementById("loginButton");
const loginMessage=document.getElementById("loginMessage");

/* 로그인 화면이 떠 있는 동안 홈/주요 메뉴 이미지를 미리 불러옵니다. */
const HLINK_WARM_IMAGES=[
  "./home.png",
  "./departments.png",
  "./local.png",
  "./district.png",
  "./repair.png"
];
function warmHlinkImages(){
  HLINK_WARM_IMAGES.forEach(function(src){
    const img=new Image();
    img.decoding="async";
    img.src=src;
  });
}
if("requestIdleCallback" in window){
  requestIdleCallback(warmHlinkImages,{timeout:1200});
}else{
  setTimeout(warmHlinkImages,200);
}

if(sessionStorage.getItem("hlink_authenticated")==="yes"){
  document.body.classList.add("hlink-authenticated");
}

async function verifyHlinkPassword(){
  const password=hlinkPassword.value.trim();
  if(!password){
    loginMessage.textContent="비밀번호를 입력해주세요.";
    return;
  }
  loginButton.disabled=true;
  loginButton.textContent="확인 중...";
  loginMessage.textContent="";
  try{
    const response=await fetch(HLINK_SUPABASE_URL+"/rest/v1/rpc/verify_hlink_password",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":HLINK_PUBLISHABLE_KEY
      },
      body:JSON.stringify({input_password:password})
    });
    if(!response.ok) throw new Error("인증 서버 오류");
    const isValid=await response.json();
    if(isValid===true){
      sessionStorage.setItem("hlink_authenticated","yes");
      document.body.classList.add("hlink-authenticated");
      hlinkPassword.value="";
      loginMessage.textContent="";
      window.scrollTo(0,0);
    }else{
      loginMessage.textContent="비밀번호가 올바르지 않습니다.";
      hlinkPassword.select();
    }
  }catch(error){
    console.error(error);
    loginMessage.textContent="접속을 확인할 수 없습니다. 잠시 후 다시 시도해주세요.";
  }finally{
    loginButton.disabled=false;
    loginButton.textContent="접속하기";
  }
}
loginButton.addEventListener("click",verifyHlinkPassword);
hlinkPassword.addEventListener("keydown",function(event){
  if(event.key==="Enter") verifyHlinkPassword();
});
