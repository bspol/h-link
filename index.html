<script>

/* =====================================================
   이미지 선로딩
===================================================== */

let localImagesLoaded = false;
let districtImagesLoaded = false;

function preloadLocalImages(){

    if(localImagesLoaded) return;

    localImagesLoaded = true;

    const images = [
        "./local_jaesong.png",
        "./local_banyeo.png",
        "./local_jwadong.png",
        "./local_jungdong.png",
        "./local_udong.png",
        "./local_bansong.png",
        "./local_banyeo23.png",
        "./local_banseok.png",
        "./local_songjeong.png"
    ];

    images.forEach(function(src){
        const img = new Image();
        img.src = src;
    });
}


function preloadDistrictImages(){

    if(districtImagesLoaded) return;

    districtImagesLoaded = true;

    const images = [
        "./district_office.png",
        "./district_dong.png",
        "./district_health.png",
        "./district_fire.png",
        "./district_support.png",
        "./district_traffic.png",
        "./district_public.png",
        "./district_facilities.png"
    ];

    images.forEach(function(src){
        const img = new Image();
        img.src = src;
    });
}


/* =====================================================
   페이지 이동
===================================================== */

function showPage(pageId){

    const target = document.getElementById(pageId);

    if(!target){
        console.error("페이지를 찾을 수 없습니다:", pageId);
        return;
    }

    document.querySelectorAll(".page").forEach(function(page){
        page.classList.remove("active");
    });

    target.classList.add("active");

    window.scrollTo(0,0);

    if(pageId === "local"){
        preloadLocalImages();
    }

    if(pageId === "district-main"){
        preloadDistrictImages();
    }
}


function goHome(){
    showPage("home");
}


/* 이미지 드래그 방지 */

document.querySelectorAll("img").forEach(function(img){
    img.setAttribute("draggable","false");
});


/* =====================================================
   Service Worker
===================================================== */

if("serviceWorker" in navigator){

    window.addEventListener("load", function(){

        navigator.serviceWorker
        .register("./sw.js")
        .catch(function(error){
            console.log("Service Worker error:", error);
        });

    });
}

</script>
